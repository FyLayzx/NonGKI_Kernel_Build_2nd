name: Build Reno5Pro+ (ColorOS 13 A13)

on:
  workflow_call:
  workflow_dispatch:

env:
  # ============ 设备参数 ============
  DEVICE_NAME : "Reno5ProPlus"
  DEVICE_CODENAME : "kona"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "BRAND_SHOW_FLAG=oneplus LD=ld.lld LLVM=1 LLVM_IAS=1"

  # ============ 内核源码 ============
  KERNEL_SOURCE : "https://github.com/youngguo18/android_kernel_OPPO_sm8250.git"
  KERNEL_BRANCH : "stock/13.1"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.0/LLVM-20.1.0-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh"
  KERNELSU_BRANCH : "v0.9.5"

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "coloros13_a13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "op_kernel"

  # 先关掉 SUSFS，等内核能编译、能开机再加回来
  SUSFS_FOLDER_FIXED: "kona_cos13_a13"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Reno5Pro+ (ColorOS 13 A13)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      # ============================================================
      # 修复 KernelSU 集成后 selinux/hooks.c 里 rc 未声明的问题
      # 在 selinux_setprocattr 函数开头统一声明 int rc = 0;
      # ============================================================
      - name: 🔧 Fix KernelSU selinux rc declaration
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== 修复前 ==="
          grep -n "int rc = 0; /\* KSU_FIX \*/" security/selinux/hooks.c || echo "尚未修复"

          python3 << 'PYEOF'
          import re
          path = "security/selinux/hooks.c"
          with open(path) as f:
              content = f.read()

          # 如果已经修过，跳过
          if 'int rc = 0; /* KSU_FIX */' in content:
              print("✅ 已修复过，跳过")
              exit(0)

          # 找到 selinux_setprocattr 函数定义，在它开头的 { 后插入 int rc = 0;
          pattern = r'(static int selinux_setprocattr\(struct task_struct \*p,?\s*\n\s*char \*name,\s*void \*value,\s*size_t size\)\s*\n\{\s*\n)'
          match = re.search(pattern, content)
          if not match:
              print("⚠️ 严格匹配失败，尝试宽松匹配")
              pattern = r'(static int selinux_setprocattr[^\n]*\n(?:[^\n]*\n)*?\{\s*\n)'
              match = re.search(pattern, content)

          if match:
              content = content[:match.end()] + '\tint rc = 0; /* KSU_FIX */\n' + content[match.end():]
              with open(path, "w") as f:
                  f.write(content)
              print("✅ 已在 selinux_setprocattr 函数开头插入 int rc = 0;")
          else:
              print("❌ 找不到 selinux_setprocattr 函数，请检查源码")
              exit(1)
          PYEOF

          echo "=== 修复后（函数开头 10 行） ==="
          grep -n -A10 "static int selinux_setprocattr" security/selinux/hooks.c | head -20
      # ============================================================

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        if: ${{ env.REKERNEL_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        if: ${{ env.DROIDSPACES_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        if: ${{ env.BASEBAND_GUARD_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        if: ${{ env.NOMOUNT_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ❗ Remove dtb and dtbo.img
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          rm -f out/arch/arm64/boot/dtbo.img
          rm -f out/arch/arm64/boot/dtb
          echo "Removed dtbo.img and dtb."

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
