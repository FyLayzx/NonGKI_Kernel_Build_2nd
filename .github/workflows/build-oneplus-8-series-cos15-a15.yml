name: Build Reno5Pro+ (ColorOS 13 A13)

on:
  workflow_call:
  workflow_dispatch:

env:
  # ============ 设备参数 ============
  DEVICE_NAME : "Reno5ProPlus"
  DEVICE_CODENAME : "kona"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "BRAND_SHOW_FLAG=oneplus LD=ld.lld LLVM=1 LLVM_IAS=1"

  # ============ 内核源码 ============
  KERNEL_SOURCE : "https://github.com/youngguo18/android_kernel_OPPO_sm8250.git"
  KERNEL_BRANCH : "stock/13.1"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.0/LLVM-20.1.0-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh"
  KERNELSU_BRANCH : "v0.9.5"

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : "false"
  SUSFS_FIXED : "false"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "coloros13_a13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "op_kernel"

  # 先关掉 SUSFS，等内核能编译、能开机再加回来
  SUSFS_FOLDER_FIXED: "kona_cos13_a13"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Reno5Pro+ (ColorOS 13 A13)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      # ============================================================
      # 修复 KernelSU 集成后 selinux/hooks.c 里 rc 未声明的问题
      # 扫描整个文件，自动定位所有用了 rc 但未声明的函数
      # ============================================================
      - name: 🔧 Fix KernelSU selinux rc declaration
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== 修复前 ==="
          grep -n "rc = security_bounded_transition\|rc = strcmp(\"u:r:init:s0\"" security/selinux/hooks.c || echo "未找到 KSU rc 调用"

          python3 << 'PYEOF'
          import re

          path = "security/selinux/hooks.c"
          with open(path) as f:
              content = f.read()

          # ============ 第 1 步：先清掉之前插错的 KSU_FIX ============
          content = content.replace('\tint rc = 0; /* KSU_FIX */\n', '')
          content = content.replace('\tint rc = 0; /* KSU_FIX */', '')

          # ============ 第 2 步：找到所有 KSU 补丁里用 rc 的位置 ============
          rc_uses = []
          for m in re.finditer(r'rc\s*=\s*(?:security_bounded_transition|strcmp\s*\(\s*"u:r:init:s0")', content):
              rc_uses.append(m.start())

          if not rc_uses:
              print("✅ 未找到需要修复的 KSU rc 调用，跳过")
              with open(path, "w") as f:
                  f.write(content)
              exit(0)

          print(f"📍 找到 {len(rc_uses)} 处 KSU rc 调用")

          # ============ 第 3 步：定位每个调用所在的函数 ============
          func_pattern = re.compile(
              r'\n\s*(?:static\s+)?(?:inline\s+)?(?:int|long|ssize_t|void|bool|unsigned\s+int)\s+(\w+)\s*\(',
              re.MULTILINE
          )
          func_matches = [(m.start(), m.end(), m.group(1)) for m in func_pattern.finditer(content)]

          funcs_to_fix = {}  # func_name -> function_body_start_pos
          for pos in rc_uses:
              candidate = None
              for fstart, fend, fname in func_matches:
                  if fend < pos:
                      candidate = (fstart, fend, fname)
                  else:
                      break
              if not candidate:
                  print(f"⚠️ 位置 {pos} 找不到所属函数")
                  continue

              _, fend, fname = candidate
              brace_pos = content.find('{', fend)
              if brace_pos == -1 or brace_pos > pos:
                  print(f"⚠️ {fname} 找不到 {{")
                  continue

              body_start = brace_pos + 1

              # 检查函数头 3000 字符内是否已有 int rc 声明
              function_head = content[body_start:body_start + 3000]
              if re.search(r'\bint\s+rc\b', function_head):
                  print(f"  ✅ {fname} 已有 rc 声明，跳过")
                  continue

              if fname not in funcs_to_fix:
                  funcs_to_fix[fname] = body_start
                  print(f"  📝 需要修复: {fname}")

          # ============ 第 4 步：从后往前插入，避免位置错位 ============
          for fname, insert_pos in sorted(funcs_to_fix.items(), key=lambda x: -x[1]):
              content = content[:insert_pos] + '\n\tint rc = 0; /* KSU_FIX */' + content[insert_pos:]
              print(f"✅ 已在 {fname} 开头插入 int rc = 0;")

          with open(path, "w") as f:
              f.write(content)

          if not funcs_to_fix:
              print("ℹ️ 没有需要修复的函数（可能已修过）")
          PYEOF

          echo ""
          echo "=== 修复后：确认 rc 使用位置附近 ==="
          grep -n -B1 -A1 "rc = security_bounded_transition\|rc = strcmp(\"u:r:init:s0\"" security/selinux/hooks.c | head -30
          echo ""
          echo "=== 确认 KSU_FIX 插入位置 ==="
          grep -n -B2 -A2 "KSU_FIX" security/selinux/hooks.c
      # ============================================================

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        if: ${{ env.REKERNEL_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        if: ${{ env.DROIDSPACES_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        if: ${{ env.BASEBAND_GUARD_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        if: ${{ env.NOMOUNT_ENABLE == 'true' }}
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ❗ Remove dtb and dtbo.img
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          rm -f out/arch/arm64/boot/dtbo.img
          rm -f out/arch/arm64/boot/dtb
          echo "Removed dtbo.img and dtb."

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
